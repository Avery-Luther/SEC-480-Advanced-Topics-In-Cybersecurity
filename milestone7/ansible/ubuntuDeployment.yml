- name: bluebuntu config
  hosts: ubuntu
  tasks:
    - name: create the .ssh dir
      file:
        path: "/home/{{ ansible_user }}/.ssh"
        state: directory
        mode: 0700
    - name: create the authorized keys file
      file:
        path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
        state: touch
        mode: 0544
    - name: add the key to the file
      blockinfile:
        dest: "/home/{{ ansible_user }}/.ssh/authorized_keys"
        block: "{{ public_key }}"

    - name: create sudoers file
      file:
        path: "/etc/sudoers.d/480"
        state: touch
        mode: 0440
      become: yes

    - name: create a sudoers entry
      blockinfile:
        dest: "/etc/sudoers.d/480"
        block: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL"
      become: yes

    - name: set hostname
      hostname:
        name: "{{ hostname }}" 
      become: yes
    
    - name : add host to hosts file
      lineinfile:
        path: /etc/hosts
        line: "127.0.1.1 {{ hostname }}"
      become: yes


    - name: Delete Old Netplan file
      file:
        path: "/etc/netplan/00-installer-config.yaml"
        state: absent
      become: yes

    - name: Place new netplan file
      blockinfile: 
        dest: "/etc/netplan/00-installer-config.yaml"
        create: true
        block: | 
          network:
            ethernets:
              ens33:
                addresses:
                  - {{ lan_ip }}/24
                nameservers:
                  addresses:
                    - {{ name_server }}
                    - {{ gateway }}
                routes:
                  -to: default
                  via: {{ gateway }}
      become: yes



    - name: bounce the box
      shell: "sleep 5 && shutdown -r now"
      become: yes
      async: 1
      poll: 0
